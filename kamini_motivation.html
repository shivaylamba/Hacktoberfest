<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kamini's Motivation Card</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #ffd1dc, #c3bef0);
    }
    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 30px 50px;
      text-align: center;
      max-width: 400px;
    }
    h2 {
      color: #5e60ce;
      margin-bottom: 10px;
    }
    p {
      color: #444;
      font-size: 1.1em;
    }
    .footer {
      margin-top: 20px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🌸 Kamini’s Motivation Card 🌸</h2>
    <p>“Keep coding, keep shining — every small PR is a big step forward!”</p>
    <div class="footer">Made with 💖 by Kamini Mishra</div>
  </div>
</body>
</html>
